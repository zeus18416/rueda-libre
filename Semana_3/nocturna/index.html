<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rueda Nocturna: recorre Medellín en bici de noche con Rueda Libre, de jueves a sábado.">
    <title>Rueda Nocturna | Rueda Libre</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-slate-950 text-slate-100">
    <main>
        <!-- Sección principal (viene del prototipo) -->
        <section class="mx-auto max-w-3xl px-6 py-20 space-y-8 text-center" aria-labelledby="titulo-campana">
            <p class="mx-auto w-fit rounded-full bg-amber-400/15 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-amber-300">
                Nuevo · Jueves a sábado
            </p>

            <h1 id="titulo-campana" class="text-5xl font-extrabold leading-tight tracking-tight text-white">
                Rueda Nocturna
            </h1>

            <p class="mx-auto max-w-xl text-lg leading-relaxed text-slate-300">
                Descubre Medellín en bici cuando se encienden las luces
            </p>

            <ul class="mx-auto flex max-w-md justify-center gap-4">
                <li class="w-1/2 rounded-xl bg-slate-900 p-4">
                    <span class="block text-xl font-bold text-amber-300 sm:text-2xl">3 rutas</span>
                    <span class="block text-sm text-slate-400">de jueves a sábado</span>
                </li>
                <li class="w-1/2 rounded-xl bg-slate-900 p-4">
                    <span class="block text-xl font-bold text-amber-300 sm:text-2xl">Desde $55.000</span>
                    <span class="block text-sm text-slate-400">por persona</span>
                </li>
            </ul>

            <!-- Botones del kit: principal, secundario y de contorno -->
            <div class="flex flex-wrap justify-center gap-4">
                <a href="#rutas" class="inline-block rounded-xl border-2 border-amber-400 bg-amber-400 px-6 py-3 text-base font-bold tracking-wide text-slate-950 shadow-md hover:border-amber-300 hover:bg-amber-300 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Inscríbete
                </a>
                <a href="#rutas" class="inline-block rounded-xl border-2 border-slate-700 bg-slate-700 px-6 py-3 text-base font-bold tracking-wide text-white shadow-md hover:border-slate-600 hover:bg-slate-600 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-slate-300 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Ver rutas
                </a>
                <a href="#rutas" class="inline-block rounded-xl border-2 border-amber-400 bg-transparent px-6 py-3 text-base font-bold tracking-wide text-amber-300 shadow-md hover:bg-amber-400/10 hover:text-amber-200 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Qué incluye
                </a>
            </div>
        </section>
    </main>
</body>

</html>
